<!DOCTYPE html>
<html lang="en" data-theme="tourist">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover and the rail's safe-area padding are one fix, not
       two. Cover gives the page the whole screen, which is what makes
       env(safe-area-inset-top) report the status bar's height instead of 0;
       the rail then pads by exactly that and reaches the physical top edge.
       Removing cover on its own (as this once did) just leaves env() at 0
       and the rail stranded below a strip it no longer owns. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- What this page is. The tagline lives on the page; a title has to say
       what the thing does, because it is read out of context in a search
       result, a browser tab and a pasted link. -->
  <title>Cabby's — Private airport transfers in Aruba</title>
  <meta name="description" content="Private fixed-price transfers across Aruba. Met at the gate, door to door, settled in advance. Free cancellation up to 24 hours before pickup." />

  <!-- The four absolute URLs below are stamped at build time from
       VITE_SITE_URL — see siteUrl() in vite.config.ts. They have to stay
       ABSOLUTE: a crawler left to resolve og:image itself is a link
       preview nobody can rely on, and on this island a WhatsApp preview
       IS the share. Unset, they fall back to what was hard-coded here
       before, so nothing changes until the real domain exists. -->
  <link rel="canonical" href="__SITE_URL__/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cabby's" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:title" content="Cabby's — Private airport transfers in Aruba" />
  <meta property="og:description" content="Private fixed-price transfers across Aruba. Met at the gate, door to door, settled in advance." />
  <meta property="og:image" content="__SITE_URL__/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Cabby's — getting there was always the point. A striped sun setting over a horizon." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cabby's — Private airport transfers in Aruba" />
  <meta name="twitter:description" content="Private fixed-price transfers across Aruba. Met at the gate, door to door, settled in advance." />
  <meta name="twitter:image" content="__SITE_URL__/og.png" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Safari tints the strip around the page with this, so it has to BE the
       page: #0B1420 was lighter than anything in the palette and painted a
       visible band above the fixed rail, which read as a gap at the top of
       the screen. --ground and the phone rail are both #020B14. -->
  <meta name="theme-color" content="#020B14" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded off the critical path. A plain rel="stylesheet" here is
       render-blocking: nothing paints until Google answers, so on airport
       wifi the page is blank for as long as the round trip takes. Fetching
       it as a preload and promoting it on load lets the hero paint in the
       fallback face immediately; display=swap brings the real face in. -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </noscript>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
