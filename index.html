<!DOCTYPE html>
<html lang="en" data-theme="tourist">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- What this page is. The tagline lives on the page; a title has to say
       what the thing does, because it is read out of context in a search
       result, a browser tab and a pasted link. -->
  <title>Cabby's — Private airport transfers in Aruba</title>
  <meta name="description" content="Private fixed-price transfers across Aruba. Met at the gate, door to door, settled in advance. Free cancellation up to 24 hours before pickup." />

  <!-- TODO: the production domain appears here and in the four absolute URLs
       below. If the site ships somewhere other than cabbys.aw, change it in
       this block and nowhere else. -->
  <link rel="canonical" href="https://cabbys.aw/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cabby's" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="https://cabbys.aw/" />
  <meta property="og:title" content="Cabby's — Private airport transfers in Aruba" />
  <meta property="og:description" content="Private fixed-price transfers across Aruba. Met at the gate, door to door, settled in advance." />
  <meta property="og:image" content="https://cabbys.aw/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Cabby's — getting there was always the point. A striped sun setting over a horizon." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cabby's — Private airport transfers in Aruba" />
  <meta name="twitter:description" content="Private fixed-price transfers across Aruba. Met at the gate, door to door, settled in advance." />
  <meta name="twitter:image" content="https://cabbys.aw/og.png" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#F2E9D5" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded off the critical path. A plain rel="stylesheet" here is
       render-blocking: nothing paints until Google answers, so on airport
       wifi the page is blank for as long as the round trip takes. Fetching
       it as a preload and promoting it on load lets the hero paint in the
       fallback face immediately; display=swap brings the real face in. -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </noscript>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
