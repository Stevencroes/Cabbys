<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cabby's">
  <!-- Golden Hour in miniature: the striped sun setting on its horizon.
       Solid shapes only — anything finer disappears at 16px. -->
  <rect width="64" height="64" rx="14" fill="#2B1F19"/>
  <clipPath id="h"><rect x="8" y="8" width="48" height="34"/></clipPath>
  <g clip-path="url(#h)">
    <circle cx="32" cy="42" r="22" fill="#E2A03F"/>
    <g fill="#2B1F19">
      <rect x="10" y="24" width="44" height="3"/>
      <rect x="10" y="31" width="44" height="3"/>
      <rect x="10" y="38" width="44" height="3"/>
    </g>
  </g>
  <rect x="8" y="44" width="48" height="4" fill="#C6452C"/>
</svg>
